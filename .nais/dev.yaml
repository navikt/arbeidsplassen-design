apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: arbeidsplassen-design
  namespace: arbeidsplassen
  labels:
    team: arbeidsplassen
spec:
  image: {{image}}
  replicas:
    min: 1
    max: 1
  resources:
    requests:
      cpu: 15m
      memory: 64Mi
    limits:
      memory: 128Mi
  ingresses:
    - https://arbeidsplassen-design.intern.dev.nav.no
  port: 8080
