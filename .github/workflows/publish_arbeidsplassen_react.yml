name: Publish REACT package to GPR
on:
  workflow_dispatch:

jobs:
  publish:
    permissions:
      packages: write
      contents: write
      actions: read
    name: Publish package
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: |
          pnpm config set @navikt:registry https://npm.pkg.github.com
          pnpm config set //npm.pkg.github.com/:_authToken $NODE_AUTH_TOKEN
          pnpm --filter @navikt/arbeidsplassen-react install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build package
        run: pnpm --filter @navikt/arbeidsplassen-react build
      - name: Publish package
        run: pnpm --filter @navikt/arbeidsplassen-react publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
